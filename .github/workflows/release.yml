name: Release

# Push a tag like v0.3.0. The tag sets the version of the extension and the Python package.
# Signing the extension needs repo secrets AMO_JWT_ISSUER / AMO_JWT_SECRET
# (https://addons.mozilla.org/developers/addon/api/key/). Without them the release ships
# only the unsigned zip, which Zen/Firefox load as a temporary add-on.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.3.0"
        required: true

permissions:
  contents: write

jobs:
  # Self-contained CLI binaries (Python + deps frozen in), so users need no Python or uv.
  # Built on 22.04 so they run on older glibc too.
  binary:
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: astral-sh/setup-uv@v6
      - name: Set version from tag
        run: sed -i "s/^version = \".*\"/version = \"${TAG#v}\"/" pyproject.toml
      - name: Build
        run: |
          uv sync --frozen --no-dev
          uv run --frozen --with pyinstaller pyinstaller --onefile --name remobro --distpath dist \
            --collect-submodules uvicorn --collect-submodules remobro --copy-metadata mcp \
            src/remobro/__main__.py
          mv dist/remobro dist/remobro-linux-${{ matrix.arch }}
      - name: Smoke test
        run: dist/remobro-linux-${{ matrix.arch }} --help
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.arch }}
          path: dist/remobro-linux-${{ matrix.arch }}

  release:
    needs: binary
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      REPO: ${{ github.repository }}
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6

      - name: Set version from tag
        run: |
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          jq --arg v "$VERSION" '.version = $v' extension/manifest.json > m.json && mv m.json extension/manifest.json
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml

      - name: Build extension
        run: npx --yes web-ext@8 build --source-dir extension --artifacts-dir dist --filename remobro-unsigned.zip

      - name: Sign extension (unlisted, self-distributed)
        if: env.AMO_JWT_ISSUER != ''
        run: |
          npx --yes web-ext@8 sign --source-dir extension --artifacts-dir signed \
            --channel unlisted --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET" \
            --approval-timeout 900000
          mv signed/*.xpi dist/remobro.xpi
          # Firefox checks this file (manifest update_url) to auto-update the add-on
          jq -n --arg v "$VERSION" --arg url "https://github.com/$REPO/releases/download/$TAG/remobro.xpi" \
            '{addons: {"remobro@iput-object": {updates: [{version: $v, update_link: $url}]}}}' > dist/updates.json

      - name: Build Python package
        run: uv build --out-dir dist

      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp install.sh dist/
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "remobro $TAG" --generate-notes
          fi
