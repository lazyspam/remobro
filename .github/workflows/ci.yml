name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: for f in extension/*.js; do node --check "$f"; done
      - name: web-ext lint
        run: npx --yes web-ext@8 lint --source-dir extension --self-hosted
      - name: Build (unsigned)
        run: npx --yes web-ext@8 build --source-dir extension --artifacts-dir dist --filename remobro-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: extension-unsigned
          path: dist/remobro-unsigned.zip

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Import check
        run: uv run python -c "import remobro.daemon, remobro.cli, remobro.store"
      - name: CLI smoke test
        run: uv run remobro --help
      - run: uv build
      - name: Binary build + smoke test
        run: |
          uv run --with pyinstaller pyinstaller --onefile --name remobro --distpath bin \
            --collect-submodules uvicorn --collect-submodules remobro --copy-metadata mcp \
            src/remobro/__main__.py
          bin/remobro --help
      - name: Installer syntax
        run: bash -n install.sh
